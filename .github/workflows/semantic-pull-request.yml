name: "Pull Request - Semantic Lint"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions: {}

jobs:
  main:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/semantic-pull-request.yml@4a6ed33ba735d57ebbcd89fe8ed35134de599a67 # 0.39.2
    permissions:
      contents: write
      pull-requests: write
