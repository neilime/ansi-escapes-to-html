name: Greetings

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
    branches: [main]

permissions: {}

jobs:
  greetings:
    if: ${{ github.event_name == 'issues' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    uses: hoverkraft-tech/ci-github-common/.github/workflows/greetings.yml@33462c06bcbbd9144d7f661929e61953604b444d # 4.3.2
    permissions:
      contents: read
      issues: write
      pull-requests: write
