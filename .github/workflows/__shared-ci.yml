name: Shared - Continuous Integration for common tasks
on:
  workflow_call:
    outputs:
      documentation-artifact-id:
        description: Generated PHP API documentation.
        value: ${{ jobs.documentation.outputs.artifact-id }}
permissions: {}
jobs:
  checks:
    uses: hoverkraft-tech/ci-github-php/.github/workflows/continuous-integration.yml@b81aa7b46f6b7a18ff1d9582c918cc1cc8296b98 # 2.0.0
    permissions:
      contents: read
      id-token: write
    with:
      ignore-plugins: false
      test: '{"coverage":"codecov"}'
      package: |
        {
          "tests": "php <<'PHP'\n<?php\nrequire 'vendor/autoload.php';\n$html = (new AnsiEscapesToHtml\\Highlighter())->toHtml(\"\\033[31mred\\033[0m\");\nif (!str_contains($html, 'red') || !str_contains($html, '<span') || str_contains($html, \"\\033\")) {\n    throw new RuntimeException('The installed highlighter must convert ANSI color codes.');\n}\nPHP"
        }
  documentation:
    uses: hoverkraft-tech/ci-github-php/.github/workflows/documentation.yml@b81aa7b46f6b7a18ff1d9582c918cc1cc8296b98 # 2.0.0
    permissions:
      contents: read
